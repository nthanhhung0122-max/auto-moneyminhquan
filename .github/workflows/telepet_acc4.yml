async def run_cyberpet_auto():
    print("""
====================================================================
|  TOOL AUTO CYBERPET IDLE 24/7 (NUOI THU DAO TOKEN $PET)          |
|  Bot: @CyberPetVN_bot                                            |
|  - StringSession RAM: Triet tieu 100% loi disk image malformed    |
|  - Dong bo chuan xac voi WebApp tren dien thoai (Fix lech so du)|
|  - Auto xem quang cao hop le (Vang, Pin +10p, Boost x2, $PET)   |
|  - Auto dao Token theo toc do thoi gian thuc                     |
|  - Tinh toan chu ky Anti-Cheat & Dong bo Pinned DB Admin         |
====================================================================
    """)

    # 1. Lay init_data khoi dong
    init_data = await fetch_fresh_init_data()
    if not init_data:
        log("ERR", "Khong the khoi dong bot vi thieu init_data!")
        return

    # 2. Doc trang thai tu CloudStorage
    state = await load_game_state_from_cloud()
    if not state:
        log("ERR", "Khong the doc du lieu tro choi tu CloudStorage!")
        return

    pet = state.get("pet", {})
    lvl = pet.get("level", 1)
    stars = pet.get("stars", 1)
    coins = state.get("coins", 0)
    tokens = float(state.get("tokens", 0.0))
    battery = state.get("energyBatterySeconds", 1800)
    ads = state.get("totalAdsWatched", 0)

    log("PROFILE", f"Level Pet: Lv.{lvl} (⭐ x{stars}) | Toc do: +{get_pet_mining_speed(lvl, stars):.4f} $PET/s")
    log("PROFILE", f"So du: {tokens:.4f} $PET (~ {int(tokens * 7):,} VND) | Vang: {coins:,} | Pin: {battery // 60} phut | Ads: {ads}")

    # Dong bo ngay lap tuc len Pinned DB khi khoi dong de 2 ben khop nhau 100%
    sync_to_admin_pinned_db(CURRENT_USER_ID, tokens, coins, ads, lvl)

    last_refresh_time = time.time()
    last_cloud_sync_time = time.time()
    last_tick_time = time.time()
    start_time = time.time()

    cycle_count = 0

    while True:
        try:
            if MAX_RUNTIME > 0 and (time.time() - start_time) >= MAX_RUNTIME:
                log("INFO", "Hoan thanh phien chay GitHub Actions. Nghi ngoi de phien sau tiep quan!")
                break

            cycle_count += 1
            now = time.time()
            elapsed_sec = int(now - last_tick_time)
            last_tick_time = now

            # 1. Dao Token theo thoi gian thuc khi con pin
            if battery > 0 and elapsed_sec > 0:
                effective_sec = min(elapsed_sec, battery)
                boost = state.get("boostMultiplier", 1)
                speed = get_pet_mining_speed(lvl, stars) * boost
                mined = speed * effective_sec

                tokens += mined
                battery = max(0, battery - effective_sec)
                state["tokens"] = tokens
                state["energyBatterySeconds"] = battery

                b_left = state.get("boostTimeLeft", 0)
                if b_left > 0:
                    b_left = max(0, b_left - effective_sec)
                    state["boostTimeLeft"] = b_left
                    if b_left == 0:
                        state["boostMultiplier"] = 1

            # 2. Xem quang cao nhan thuong (Luan phien: Battery -> Coins -> Boost -> Pet)
            if battery < 1800:
                reward_type = "battery"
            elif cycle_count % 5 == 0:
                reward_type = "boost"
            elif cycle_count % 3 == 0:
                reward_type = "pet"
            else:
                reward_type = "coins"

            ads += 2
            state["totalAdsWatched"] = ads
            state["dailyAdsWatched"] = state.get("dailyAdsWatched", 0) + 2

            reward_desc = ""
            if reward_type == "battery":
                battery += 600
                state["energyBatterySeconds"] = battery
                reward_desc = f"+10p Pin (Tong: {battery // 60}p)"
            elif reward_type == "coins":
                coins += 5
                state["coins"] = coins
                state["coinsFromAds"] = state.get("coinsFromAds", 0) + 5
                reward_desc = f"+5 Vang (Tong: {coins:,})"
            elif reward_type == "boost":
                state["boostMultiplier"] = 2
                state["boostTimeLeft"] = 120
                reward_desc = "x2 Toc do dao (2 phut)"
            elif reward_type == "pet":
                tokens += 0.2
                state["tokens"] = tokens
                reward_desc = f"+0.2 $PET (Tong: {tokens:.4f})"

            log("AD", f"L{cycle_count}: Xem quang cao [{reward_type.upper()}] -> {reward_desc} | Ads: {ads}")

            # 3. Kiem tra va Nang cap Pet (Chong loi Anti-Cheat giang cap cua game)
            cost = get_upgrade_cost(lvl)
            if coins >= cost and ads >= 2000:
                coins -= cost
                lvl += 1
                pet["level"] = lvl
                state["pet"] = pet
                state["coins"] = coins
                log("UPGRADE", f"🎉 Pet len Lv.{lvl}! Toc do moi: +{get_pet_mining_speed(lvl, stars):.4f} $PET/s!")

            # 4. Luu CloudStorage voi Future Timestamp (chong bi dien thoai ghi de du lieu cu)
            await save_game_state_to_cloud(state)

            # 5. Dong bo Pinned DB Admin
            if now - last_cloud_sync_time >= CLOUD_SYNC_INTERVAL:
                log("SYNC", "Dang dong bo so du len Telegram Cloud DB (Admin Chat)...")
                ok = sync_to_admin_pinned_db(CURRENT_USER_ID, tokens, coins, ads, lvl)
                if ok:
                    log("SYNC", f"Dong bo thanh cong! So du: {tokens:.2f} $PET (~{int(tokens * 7):,} VND)")
                last_cloud_sync_time = now

            # 6. Lam moi token Telethon moi 2 tieng
            if now - last_refresh_time >= 7200:
                await fetch_fresh_init_data()
                last_refresh_time = now

            # 7. Thong ke dinh ky
            if cycle_count % 4 == 0:
                log("STATUS", f"So du: {tokens:.4f} $PET (~ {int(tokens * 7):,} VND) | Pin: {battery // 60}p | Vang: {coins:,} | Lv.{lvl}")

            await asyncio.sleep(AD_INTERVAL_SECONDS)

        except KeyboardInterrupt:
            log("INFO", "Da dung bot theo yeu cau.")
            break
        except Exception as e:
            log("ERR", f"Loi vong lap: {e}")
            await asyncio.sleep(5)

if __name__ == "__main__":
    try:
        asyncio.run(run_cyberpet_auto())
    except KeyboardInterrupt:
        print("\n[STOP] Da dung bot auto CyberPet.")
