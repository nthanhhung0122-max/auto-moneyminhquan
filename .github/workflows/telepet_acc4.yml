def get_authorized_client():
    session_str = os.getenv("TELEGRAM_STRING_SESSION") or DEFAULT_STRING_SESSION
    return TelegramClient(StringSession(session_str), API_ID, API_HASH)

async def fetch_fresh_init_data():
    global CURRENT_INIT_DATA, CURRENT_USER_ID, CURRENT_USER_NAME
    log("+", f"Dang ket noi Telegram de lay init_data @{BOT_USERNAME}...")
    client = get_authorized_client()
    await client.connect()

    if not await client.is_user_authorized():
        log("ERR", "Session Telegram StringSession chua hop le!")
        await client.disconnect()
        return None

    try:
        bot = await client.get_input_entity(BOT_USERNAME)
        web_view = await client(RequestWebViewRequest(
            peer=bot,
            bot=bot,
            platform="android",
            from_bot_menu=False,
            url=WEBAPP_URL
        ))
        frag = urllib.parse.urlparse(web_view.url).fragment
        params = urllib.parse.parse_qs(frag)
        CURRENT_INIT_DATA = params.get("tgWebAppData", [None])[0]

        parsed_init = urllib.parse.parse_qs(CURRENT_INIT_DATA)
        user_str = parsed_init.get("user", ["{}"])[0]
        user_obj = json.loads(user_str)
        CURRENT_USER_ID = str(user_obj.get("id", CURRENT_USER_ID))
        CURRENT_USER_NAME = (user_obj.get("first_name", "") + " " + user_obj.get("last_name", "")).strip() or user_obj.get("username", "")

        log("OK", f"Da cap nhat init_data CyberPet! User: {CURRENT_USER_NAME} (ID: {CURRENT_USER_ID})")
        return CURRENT_INIT_DATA
    except Exception as e:
        log("ERR", f"Loi lay init_data CyberPet: {e}")
        return None
    finally:
        await client.disconnect()

