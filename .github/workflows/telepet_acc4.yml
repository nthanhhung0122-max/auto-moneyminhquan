name: Auto Nhiem Vu (Acc 4)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  run-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests telethon colorama beautifulsoup4

      - name: Chay Bot Nhiem Vu Acc 4 (Tu dong bat lai sau 1 phut neu tat)
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          TELEGRAM_SESSION_B64_ACC4: ${{ secrets.TELEGRAM_SESSION_B64_ACC4 }}
        run: |
          while true; do
            python auto_kiemtien4.py || true
            echo "--------------------------------------------------------"
            echo "Bot vua ket thuc, nghi 60 giay roi tu dong khoi dong lai..."
            echo "--------------------------------------------------------"
            sleep 60
          done
